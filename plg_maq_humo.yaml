alias: On_Humo_Operario_Dinamico
description: "Automatización genérica controlada por el grupo de habitaciones del operario"
triggers:
  - trigger: state
    entity_id: group.habitaciones_monitoreadas_humo
    to: "Ocupado"

conditions: []

actions:
  # 1. Espera inicial de 10 minutos
  - delay:
      minutes: 10

  # 2. Verificar que la habitación específica que disparó la acción siga 'Ocupado'
  - condition: template
    value_template: "{{ is_state(trigger.entity_id, 'Ocupado') }}"

  # 3. Encender el switch del extractor correspondiente extrayendo el número
  - action: switch.turn_on
    target:
      entity_id: >-
        {% set num = trigger.entity_id.split('_')[-1] %}
        switch.habitacion_{{ num }}_cs_humo_hab_{{ num }}

  # 4. Bucle dinámico mientras esa habitación continúe 'Ocupado'
  - repeat:
      while:
        - condition: template
          value_template: "{{ is_state(trigger.entity_id, 'Ocupado') }}"
      sequence:
        - delay:
            minutes: 30
        - condition: template
          value_template: "{{ is_state(trigger.entity_id, 'Ocupado') }}"
        - action: switch.turn_on
          target:
            entity_id: >-
              {% set num = trigger.entity_id.split('_')[-1] %}
              switch.habitacion_{{ num }}_cs_humo_hab_{{ num }}

mode: parallel