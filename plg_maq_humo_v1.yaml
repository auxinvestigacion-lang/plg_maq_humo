blueprint:
  name: "Bp-Plugin Humo v1.0"
  description: 
    Automatizacion para controla el activador de humo de una habitación de forma cíclica y automática cuando pasa a estado "Ocupado".
    Espera un tiempo inicial configurado antes del primer disparo y luego repite la acción periódicamente mientras la habitación continúe ocupada.
    Permite al operario vincular los dispositivos y ajustar los tiempos en segundos desde la interfaz sin modificar código.

  domain: automation
  input:
    selector_ocupacion:
      name: Selector Plugin Motel
      description: Selecciona el plugin de la habitación.
      selector:
        entity:
          filter:
            - domain: input_select
    
    switch_humo:
      name: Selector CS_Humo
      description: Selecciona el contacto seco del disparados de humo de la habitación.
      selector:
        entity:
          filter:
            - domain: switch

    tiempo_espera_inicial:
      name: Disparo inicial (segundos)
      description: Seleccion de tiempo para el primer dispado de humo.
      default: 600
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: "segundos"

    tiempo_intervalo_ciclo:
      name: Intervalo entre encendidos (segundos)
      description: Tiempo en segundos entre repeticiones mientras continúe ocupada.
      default: 1800
      selector:
        number:
          min: 5
          max: 7200
          unit_of_measurement: "segundos"

# Variables internas leídas desde el formulario del operario
variables:
  entidad_ocupacion: !input selector_ocupacion
  entidad_switch: !input switch_humo

triggers:
  - trigger: state
    entity_id: !input selector_ocupacion
    to: "Ocupado"

conditions: []

actions:
  # 1. Espera inicial configurada en segundos por el operario
  - delay:
      seconds: !input tiempo_espera_inicial

  # 2. Verificar que continúe 'Ocupado'
  - condition: template
    value_template: "{{ is_state(entidad_ocupacion, 'Ocupado') }}"

  # 3. Primer encendido del extractor
  - action: switch.turn_on
    target:
      entity_id: !input switch_humo

  # 4. Bucle recurrente interactivo
  - repeat:
      while:
        - condition: template
          value_template: "{{ is_state(entidad_ocupacion, 'Ocupado') }}"
      sequence:
        - delay:
            seconds: !input tiempo_intervalo_ciclo
        - condition: template
          value_template: "{{ is_state(entidad_ocupacion, 'Ocupado') }}"
        - action: switch.turn_on
          target:
            entity_id: !input switch_humo

mode: parallel