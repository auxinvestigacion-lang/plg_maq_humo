blueprint:
  name: "Control de Humo/Extracción Interactivo por Habitación (Segundos)"
  description: "Permite al operario seleccionar el selector de ocupación y el interruptor de extractor correspondiente, configurando los tiempos en segundos."
  domain: automation
  input:
    selector_ocupacion:
      name: Selector de Ocupación
      description: Selecciona el input_select de la habitación (ej. input_select.plgmotelfar_128).
      selector:
        entity:
          filter:
            - domain: input_select
    
    switch_humo:
      name: Extractor / Switch de Humo
      description: Selecciona el switch del extractor de la habitación (ej. switch.habitacion_128_cs_humo_hab_128).
      selector:
        entity:
          filter:
            - domain: switch

    tiempo_espera_inicial:
      name: Tiempo de espera inicial (segundos)
      description: Segundos transcurridos desde que pasa a Ocupado hasta el primer encendido.
      default: 600
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: "segundos"

    tiempo_intervalo_ciclo:
      name: Intervalo entre encendidos (segundos)
      description: Tiempo en segundos entre repeticiones mientras continúe ocupada.
      default: 1800
      selector:
        number:
          min: 5
          max: 7200
          unit_of_measurement: "segundos"

# Variables internas leídas desde el formulario del operario
variables:
  entidad_ocupacion: !input selector_ocupacion
  entidad_switch: !input switch_humo

triggers:
  - trigger: state
    entity_id: !input selector_ocupacion
    to: "Ocupado"

conditions: []

actions:
  # 1. Espera inicial configurada en segundos por el operario
  - delay:
      seconds: !input tiempo_espera_inicial

  # 2. Verificar que continúe 'Ocupado'
  - condition: template
    value_template: "{{ is_state(entidad_ocupacion, 'Ocupado') }}"

  # 3. Primer encendido del extractor
  - action: switch.turn_on
    target:
      entity_id: !input switch_humo

  # 4. Bucle recurrente interactivo
  - repeat:
      while:
        - condition: template
          value_template: "{{ is_state(entidad_ocupacion, 'Ocupado') }}"
      sequence:
        - delay:
            seconds: !input tiempo_intervalo_ciclo
        - condition: template
          value_template: "{{ is_state(entidad_ocupacion, 'Ocupado') }}"
        - action: switch.turn_on
          target:
            entity_id: !input switch_humo

mode: parallel